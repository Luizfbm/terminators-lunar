name: Deploy

# Manual only: deploys are done by SSH after both halves of CI are green on main (see
# CLAUDE.md, "Deploy"). A push to main no longer starts it, so it never runs on a machine
# this repo cannot use.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lunar-vps]
    environment: production
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull and restart the stack
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -se <<'SCRIPT'
          set -euo pipefail
          cd /opt/lunar
          git fetch --quiet origin main
          git reset --hard origin/main
          # The image first: fetch-data.sh cuts the off-pole DEM windows with it.
          docker compose -f deploy/compose.yaml --env-file .env build backend
          bash deploy/fetch-data.sh
          docker compose -f deploy/compose.yaml --env-file .env up -d --build --remove-orphans
          # Caddyfile is a single-file bind mount: git reset swaps the file, the running
          # container keeps the old one, and compose sees no change. Restart reloads it.
          docker compose -f deploy/compose.yaml --env-file .env restart caddy
          docker image prune -f >/dev/null
          # The memory cap and the per-IP cap from compose.yaml reached the container.
          test "$(docker inspect lunar-backend-1 --format '{{.HostConfig.Memory}}')" -gt 0
          docker exec lunar-backend-1 printenv LUNAR_IP_LIMIT_PER_MINUTE | grep -qx '[1-9][0-9]*'
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' lunar-backend-1
          SCRIPT
      - name: Smoke test
        run: |
          # The placeholder answered /health too, so check the real engine: /meta has
          # an engine version and /visibility for Site 001 carries the full mask.
          API=https://lunar-api.luizfbm.win
          check() {
            # The placeholder was one line of text; the app is a page with a root to mount on.
            curl -sf https://lunar.luizfbm.win | grep -q 'id="root"' || return 1
            curl -sf $API/health >/dev/null || return 1
            curl -sf $API/meta | jq -e '.engine_version | type == "string" and length > 0' || return 1
            curl -sf "$API/visibility?site_id=001&start=$(date -u +%F)T00:00:00Z" \
              | jq -e '.horizon.samples | length == 720' || return 1
            # An off-pole Site (the requirement) only answers from the backend just deployed.
            curl -sf "$API/visibility?site_id=BG1&start=$(date -u +%F)T00:00:00Z&duration_hours=24" \
              | jq -e '.provenance.dems[0].product == "SLDEM2015_512"' || return 1
            # The generated docs stay off the public host (the requirement).
            for path in /docs /redoc /openapi.json; do
              test "$(curl -s -o /dev/null -w '%{http_code}' $API$path)" = 404 || return 1
            done
          }
          for i in $(seq 30); do
            check && exit 0
            sleep 5
          done
          echo "Smoke test failed. Last answers:"
          curl -s $API/meta; echo
          curl -s -o /dev/null -w '%{http_code}\n' "$API/visibility?site_id=001&start=$(date -u +%F)T00:00:00Z"
          exit 1
