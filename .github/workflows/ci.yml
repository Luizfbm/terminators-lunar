name: CI

on:
  # Only pull requests into main: the ones into an integration branch get their run on the
  # integration PR's head, so the two runners don't queue a run per feature branch.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The e2e below runs only on these two, as a second opinion on the Mac's run.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, every night, on main

concurrency:
  # The event is in the name so the nightly run never cancels a run for a push to main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# CI is split in two halves (decided by Luiz on 15/11/2026, to cut the time from a push to green
# from about 45 minutes to about 15).
# - On Luiz's Mac, scripts/ci-mac.sh, started by .github/workflows/mac.yml on every pull request
#   into main and every push to main: everything heavy. ruff, mypy, pytest, the validation suite,
#   eslint, tsc, vitest, the generated-types check and the full Playwright e2e. It reports the
#   commit status `mac-gates`.
# - Here, on our two runners on the VPS (deploy/runner/): the light checks, the contract lint
#   (seconds) and schemathesis (about 5 minutes). They run on every pull request and push to main.
#   The e2e job below runs only by hand (workflow_dispatch) and every night: the same suite on a
#   second machine, software WebGL, one browser per runner, in two shards (about 40 minutes).
# A pull request merges only with both halves green: this workflow and `mac-gates`.
# Conventions: backend/ is a uv project exposing the FastAPI app at app.main:app;
# frontend/ has npm scripts lint, typecheck, test, e2e and generate:types.
jobs:
  contract:
    runs-on: [self-hosted, lunar-vps]
    steps:
      - uses: actions/checkout@v7
        with:
          # Our runners keep their workspace: the DEM fixtures, the venv and node_modules
          # stay from the last job instead of being fetched again.
          clean: false
      - run: npx --yes @redocly/cli@2.77.0 lint contract/openapi.yaml

  schemathesis:
    runs-on: [self-hosted, lunar-vps]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: "$GITHUB_WORKSPACE/fixtures/dem/fetch.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv sync --locked --project backend
      - name: Start API
        working-directory: backend
        # The assistant's cap is 10 questions a minute from one address unless it is set.
        # The fuzzer asks far more than that, and every answer past the cap would be a 503.
        env:
          LUNAR_ASSISTANT_IP_LIMIT_PER_MINUTE: "0"
        run: |
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          exit 1
      - run: uvx schemathesis run contract/openapi.yaml --url http://localhost:8000 --checks all

  e2e:
    # Not on a pull request or a push: the Mac runs the whole suite there (mac.yml).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, lunar-vps]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # One browser per runner: two each, on software WebGL in 5 shared cores, timed out.
      - run: npx playwright test --shard=${{ matrix.shard }}/2 --workers=1
